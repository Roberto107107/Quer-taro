{% extends "base.html" %}

{% block title %}
Iniciar sesión | NEXO
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            <div class="auth-logo-icon">
                <i class="fa-solid fa-link"></i>
            </div>

            <h1>NEXO</h1>

            <p>Comunicación Institucional</p>
        </div>


        <div class="auth-header">
            <h2>Bienvenido</h2>

            <p>
                Ingresa a tu cuenta institucional
            </p>
        </div>


        <form action="{{ url_for('inicio') }}" method="GET">

            <div class="form-group">

                <label for="correo">
                    Correo institucional
                </label>

                <div class="input-container">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="usuario@organizacion.gob.mx"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <div class="input-container">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>

            </div>


            <div class="login-options">

                <label class="remember">

                    <input type="checkbox">

                    <span>Recordarme</span>

                </label>

                <a href="#">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>


            <button type="submit" class="btn-primary">

                <i class="fa-solid fa-right-to-bracket"></i>

                Iniciar sesión

            </button>

        </form>


        <div class="auth-divider">
            <span>o</span>
        </div>


        <div class="register-link">

            ¿No tienes una cuenta?

            <a href="{{ url_for('registro') }}">
                Crear cuenta
            </a>

        </div>

    </div>

</div>

{% endblock %}
